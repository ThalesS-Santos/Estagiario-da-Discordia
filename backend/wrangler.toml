name = "paradoxo-estagiario-ia"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

[vars]
# Modelo principal e reservas (tentados em ordem se der 404/429/5xx). Ajuste conforme sua conta.
GEMINI_MODEL = "gemini-2.5-flash"
GEMINI_FALLBACK_MODELS = "gemini-2.0-flash,gemini-2.5-flash-lite"
# Limite por IP (best effort, por instância do Worker).
RATE_LIMIT_PER_MINUTE = "6"

# A chave NAO fica aqui. Guarde com:  npx wrangler secret put GEMINI_API_KEY
